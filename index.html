  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --bg-card: #161616;
      --border: #2a2a2a;
      --border-light: #333333;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --text-muted: #666666;
      --accent: #ffffff;
      --tag-bg: #1e1e1e;
      --whatsapp: #25d366;
      --whatsapp-dark: #1da851;
      --overlay: rgba(0, 0, 0, 0.85);
      --radius: 8px;
      --radius-lg: 12px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection { background: #fff; color: #000; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .logo img {
      height: 108px;
      width: auto;
    }

    nav { display: flex; gap: 20px; align-items: center; }
    nav a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color var(--transition);
    }
    nav a:hover { color: var(--text-primary); }
    nav a svg { width: 22px; height: 22px; }

    .hero {
      text-align: center;
      padding: 80px 24px 40px;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 8vw, 80px);
      letter-spacing: 6px;
      line-height: 1;
      margin-bottom: 16px;
    }

    .hero p {
      color: var(--text-secondary);
      font-size: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 16px 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 20px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: all var(--transition);
    }

    .filter-btn:hover { border-color: var(--border-light); color: var(--text-primary); }
    .filter-btn.active { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); }

    .search-bar {
      flex: 1;
      max-width: 320px;
      margin: 0 20px;
    }

    .search-bar input {
      width: 100%;
      padding: 12px 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 24px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color var(--transition);
    }

    .search-bar input::placeholder { color: var(--text-muted); }
    .search-bar input:focus { border-color: var(--border-light); }

    .results-count {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .product-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .product-card:hover {
      border-color: var(--border-light);
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .product-image-wrap {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: var(--bg-secondary);
    }

    .product-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .product-card:hover .product-image-wrap img { transform: scale(1.05); }

    .product-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .product-info { padding: 16px; }
    .product-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }

    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .product-price.consult {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }



    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .no-results h3 { font-size: 24px; margin-bottom: 8px; color: var(--text-secondary); }



    footer {
      text-align: center;
      padding: 40px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
    }

    footer a { color: var(--text-secondary); text-decoration: none; }

    @media (max-width: 768px) {
      .hero { padding: 48px 24px 24px; }
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 0 16px 60px; }
    }

    @media (max-width: 480px) {
      .logo img { height: 80px; }
      .product-grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 60px; }
      .product-info { padding: 10px; }
      .product-name { font-size: 12px; }
      .product-price { font-size: 14px; }
      nav { gap: 12px; }
      nav a { font-size: 11px; }
    }
  </style>
</head>

        sizes: ["S", "M", "L", "XL"]
      },
      {
        id: 73,
        name: "Franela F1 5",
        category: "franela-f1",
        categoryLabel: "Franela F1",
        price: "$20",
        images: ["img/f1/5.jpg"],
        description: "Franela F1 de alta calidad. Diseño exclusivo para los amantes de la Fórmula 1 y el streetwear.",
        sizes: ["S", "M", "L", "XL"]
      },
      {
        id: 74,
        name: "Franela F1 6",
        category: "franela-f1",
        categoryLabel: "Franela F1",
        price: "$20",
        images: ["img/f1/6.jpg"],
        description: "Franela F1 de alta calidad. Diseño exclusivo para los amantes de la Fórmula 1 y el streetwear.",
        sizes: ["S", "M", "L", "XL"]
      },
    ];

    // ═══════════════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════════════

    let currentFilter = "todos";
    let searchQuery = "";

    const productGrid = document.getElementById("productGrid");
    const resultsCount = document.getElementById("resultsCount");
    const searchInput = document.getElementById("searchInput");

    // ═══════════════════════════════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════════════════════════════

    function getFilteredProducts() {
      return products.filter(p => {
        const matchCategory = currentFilter === "todos" || p.category === currentFilter;
        const matchSearch = !searchQuery || p.name.toLowerCase().includes(searchQuery) || p.description.toLowerCase().includes(searchQuery);
        return matchCategory && matchSearch;
      });
    }

    function renderProducts() {
      const filtered = getFilteredProducts();
      resultsCount.textContent = filtered.length + " producto" + (filtered.length !== 1 ? "s" : "") + " encontrado" + (filtered.length !== 1 ? "s" : "");

      if (filtered.length === 0) {
        productGrid.innerHTML = '<div class="no-results"><h3>Sin resultados</h3><p>No se encontraron productos para esta búsqueda.</p></div>';
        return;
      }

      productGrid.innerHTML = filtered.map(function(p) {
        return '<a class="product-card" href="product-detail.html?id=' + p.id + '">' +
          '<div class="product-image-wrap">' +
            '<img src="' + p.images[0] + '" alt="' + p.name + '" loading="lazy" class="product-main-img">' +
            '<span class="product-tag">' + p.categoryLabel + '</span>' +
          '</div>' +
          '<div class="product-info">' +
            '<p class="product-name">' + p.name + '</p>' +
            '<p class="product-price' + (p.price === 'Consultar precio' ? ' consult' : '') + '">' + p.price + '</p>' +
          '</div>' +
        '</a>';
      }).join("");
    }

    // ═══════════════════════════════════════════════════════════
    //  FILTERS
    // ═══════════════════════════════════════════════════════════

    document.querySelectorAll(".filter-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderProducts();
        document.getElementById("catalogo").scrollIntoView({ behavior: "smooth" });
      });
    });

    // ═══════════════════════════════════════════════════════════
    //  SEARCH
    // ═══════════════════════════════════════════════════════════

    var searchTimeout;
    searchInput.addEventListener("input", function(e) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(function() {
        searchQuery = e.target.value.toLowerCase().trim();
        renderProducts();
      }, 300);
    });

    // ═══════════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════════

    renderProducts();
  </script>
</body>
