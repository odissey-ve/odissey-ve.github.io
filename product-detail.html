<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --bg-card: #161616;
      --border: #2a2a2a;
      --border-light: #333333;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --text-muted: #666666;
      --accent: #ffffff;
      --tag-bg: #1e1e1e;
      --whatsapp: #25d366;
      --whatsapp-dark: #1da851;
      --overlay: rgba(0, 0, 0, 0.85);
      --radius: 8px;
      --radius-lg: 12px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection { background: #fff; color: #000; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .logo img { height: 108px; width: auto; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--text-primary); }
    .back-link svg { width: 18px; height: 18px; }

    .detail-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .breadcrumb {
      margin-bottom: 24px;
    }

    .breadcrumb a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      transition: color var(--transition);
    }
    .breadcrumb a:hover { color: var(--text-primary); }
    .breadcrumb span { color: var(--text-secondary); }

    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
    }

    /* ─── LEFT: GALLERY ─── */

    .gallery {
      position: sticky;
      top: 104px;
    }

    .gallery-main {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      cursor: crosshair;
    }

    .gallery-main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
      display: block;
    }

    .gallery-main img.zoom-active {
      cursor: zoom-out;
    }

    .zoom-lens {
      display: none;
      position: absolute;
      width: 180px;
      height: 180px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      pointer-events: none;
      background-repeat: no-repeat;
      z-index: 5;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .zoom-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 200;
      cursor: zoom-out;
      align-items: center;
      justify-content: center;
    }

    .zoom-overlay.open { display: flex; }

    .zoom-overlay img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: var(--radius-lg);
    }

    .zoom-overlay-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition);
    }
    .zoom-overlay-close:hover { background: rgba(255,255,255,0.2); }

    .gallery-thumbs {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .gallery-thumbs:empty { display: none; }

    .gallery-thumb {
      flex: 0 0 72px;
      height: 72px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background: var(--bg-secondary);
      transition: border-color var(--transition), opacity var(--transition);
      opacity: 0.5;
    }

    .gallery-thumb:hover { opacity: 0.8; }
    .gallery-thumb.active { border-color: var(--text-primary); opacity: 1; }

    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ─── RIGHT: PRODUCT INFO ─── */

    .product-detail-info {
      padding-top: 8px;
    }

    .detail-category {
      display: inline-block;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .detail-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .detail-price {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .detail-price.consult {
      font-size: 20px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .detail-divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .detail-sizes-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .detail-sizes {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .size-btn {
      padding: 10px 24px;
      border: 1px solid var(--border);
      background: var(--tag-bg);
      color: var(--text-secondary);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      transition: all var(--transition);
    }

    .size-btn:hover { border-color: var(--border-light); color: var(--text-primary); }
    .size-btn.active { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); }

    .detail-desc-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .detail-desc {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .btn-whatsapp-detail {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: var(--whatsapp);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--transition);
    }

    .btn-whatsapp-detail:hover { background: var(--whatsapp-dark); }

    .detail-meta {
      display: flex;
      gap: 24px;
      margin-top: 24px;
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .detail-meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-meta-item .label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-meta-item .value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* ─── PRODUCT NOT FOUND ─── */

    .not-found {
      text-align: center;
      padding: 120px 24px;
    }

    .not-found h2 {
      font-size: 24px;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }

    .not-found p {
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .not-found a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: all var(--transition);
    }

    .not-found a:hover { border-color: var(--border-light); background: var(--bg-card); }

    footer {
      text-align: center;
      padding: 40px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
    }
    footer a { color: var(--text-secondary); text-decoration: none; }

    @media (max-width: 900px) {
      .detail-layout {
        grid-template-columns: 1fr;
        gap: 32px;
      }
      .gallery { position: static; }
      .detail-title { font-size: 22px; }
      .detail-price { font-size: 26px; }
    }

    @media (max-width: 480px) {
      .header-inner { height: 60px; }
      .logo img { height: 80px; }
      .detail-wrapper { padding: 20px 16px 60px; }
      .gallery-main { aspect-ratio: 1; border-radius: var(--radius); }
      .gallery-thumb { flex: 0 0 56px; height: 56px; }
      .detail-title { font-size: 20px; }
      .detail-price { font-size: 24px; }
      .btn-whatsapp-detail { padding: 14px; font-size: 14px; }
    }
  </style>

        description: "Franela F1 de alta calidad. Diseño exclusivo para los amantes de la Fórmula 1 y el streetwear.",
        sizes: ["S", "M", "L", "XL"]
      },
      {
        id: 74,
        name: "Franela F1 6",
        category: "franela-f1",
        categoryLabel: "Franela F1",
        price: "$20",
        images: ["img/f1/6.jpg"],
        description: "Franela F1 de alta calidad. Diseño exclusivo para los amantes de la Fórmula 1 y el streetwear.",
        sizes: ["S", "M", "L", "XL"]
      }
    ];

    // ─── STATE ───
    var activeImageIndex = 0;
    var selectedSize = null;

    // ─── INIT ───
    (function() {
      var params = new URLSearchParams(window.location.search);
      var productId = parseInt(params.get("id"));
      var product = products.find(function(p) { return p.id === productId; });

      if (!product) {
        document.getElementById("detailContent").innerHTML =
          '<div class="not-found">' +
            '<h2>Producto no encontrado</h2>' +
            '<p>El producto que buscas no existe o fue removido.</p>' +
            '<a href="index.html">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>' +
              'Volver al catálogo' +
            '</a>' +
          '</div>';
        document.title = "ODISSEY — Producto no encontrado";
        return;
      }

      document.title = "ODISSEY — " + product.name;
      selectedSize = null;
      activeImageIndex = 0;

      var images = product.images;
      var hasMultiple = images.length > 1;

      var thumbsHTML = "";
      if (hasMultiple) {
        thumbsHTML = '<div class="gallery-thumbs">' +
          images.map(function(src, i) {
            return '<div class="gallery-thumb' + (i === 0 ? ' active' : '') + '" data-index="' + i + '">' +
              '<img src="' + src + '" alt="' + product.name + ' - imagen ' + (i + 1) + '">' +
            '</div>';
          }).join("") +
        '</div>';
      }

      var sizesHTML = "";
      if (product.sizes && product.sizes.length > 0) {
        sizesHTML =
          '<p class="detail-sizes-label">Tallas</p>' +
          '<div class="detail-sizes" id="detailSizes">' +
            product.sizes.map(function(s) {
              return '<button class="size-btn" data-size="' + s + '">' + s + '</button>';
            }).join("") +
          '</div>';
      }

      var waMsg = encodeURIComponent("Hola, me interesa la prenda \"" + product.name + "\"");
      if (product.sizes.length > 1) {
        waMsg = encodeURIComponent("Hola, me interesa la prenda \"" + product.name + "\" y quiero saber si está disponible en talla " + product.sizes[0]);
      }

      var html =
        '<nav class="breadcrumb">' +
          '<a href="index.html">Catálogo</a>' +
          '<span> / </span>' +
          '<span>' + product.name + '</span>' +
        '</nav>' +

        '<div class="detail-layout">' +

          '<div class="gallery">' +
            '<div class="gallery-main" id="galleryMain">' +
              '<img src="' + images[0] + '" alt="' + product.name + '" id="galleryMainImg">' +
              '<div class="zoom-lens" id="zoomLens"></div>' +
            '</div>' +
            thumbsHTML +
          '</div>' +

          '<div class="product-detail-info">' +
            '<span class="detail-category">' + product.categoryLabel + '</span>' +
            '<h1 class="detail-title">' + product.name + '</h1>' +
            '<p class="detail-price' + (product.price === "Consultar precio" ? " consult" : "") + '">' + product.price + '</p>' +
            '<div class="detail-divider"></div>' +
            sizesHTML +
            '<p class="detail-desc-label">Descripción</p>' +
            '<p class="detail-desc">' + product.description + '</p>' +
            '<a class="btn-whatsapp-detail" href="' + WHATSAPP_URL + '&text=' + waMsg + '" target="_blank" rel="noopener">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' +
              'Pedir por WhatsApp' +
            '</a>' +
            '<div class="detail-meta">' +
              '<div class="detail-meta-item"><span class="label">Categoría</span><span class="value">' + product.categoryLabel + '</span></div>' +
              '<div class="detail-meta-item"><span class="label">Fotos</span><span class="value">' + images.length + ' imagen' + (images.length !== 1 ? 'es' : '') + '</span></div>' +
              '<div class="detail-meta-item"><span class="label">Envío</span><span class="value">Toda Venezuela</span></div>' +
            '</div>' +
          '</div>' +

        '</div>';

      document.getElementById("detailContent").innerHTML = html;

      // ─── THUMBNAIL CLICKS ───
      if (hasMultiple) {
        document.querySelectorAll(".gallery-thumb").forEach(function(thumb) {
          thumb.addEventListener("click", function() {
            var idx = parseInt(thumb.dataset.index);
            setActiveImage(idx, images);
          });
        });
      }

      // ─── SIZE BUTTONS ───
      var sizesContainer = document.getElementById("detailSizes");
      if (sizesContainer) {
        sizesContainer.querySelectorAll(".size-btn").forEach(function(btn) {
          btn.addEventListener("click", function() {
            sizesContainer.querySelectorAll(".size-btn").forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");
            selectedSize = btn.dataset.size;
          });
        });
      }

      // ─── HOVER ZOOM (lens on main image) ───
      var mainEl = document.getElementById("galleryMain");
      var mainImg = document.getElementById("galleryMainImg");
      var lens = document.getElementById("zoomLens");

      mainEl.addEventListener("mouseenter", function() {
        if (window.innerWidth < 900) return;
        lens.style.display = "block";
        lens.style.backgroundImage = "url('" + mainImg.src + "')";
      });

      mainEl.addEventListener("mousemove", function(e) {
        if (window.innerWidth < 900) return;
        var rect = mainEl.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var lensW = lens.offsetWidth / 2;
        var lensH = lens.offsetHeight / 2;
        var scale = 2.5;
        lens.style.backgroundSize = (mainImg.width * scale) + "px " + (mainImg.height * scale) + "px";
        var bgX = -(x * scale - lensW);
        var bgY = -(y * scale - lensH);
        lens.style.left = (x - lensW) + "px";
        lens.style.top = (y - lensH) + "px";
        lens.style.backgroundPosition = bgX + "px " + bgY + "px";
      });

      mainEl.addEventListener("mouseleave", function() {
        lens.style.display = "none";
      });

      // ─── CLICK ZOOM (fullscreen overlay) ───
      var overlay = document.getElementById("zoomOverlay");
      var overlayImg = document.getElementById("zoomOverlayImg");
      var overlayClose = document.getElementById("zoomOverlayClose");

      mainEl.addEventListener("click", function(e) {
        if (e.target.closest(".zoom-overlay")) return;
        overlayImg.src = mainImg.src;
        overlayImg.alt = product.name;
        overlay.classList.add("open");
        document.body.style.overflow = "hidden";
      });

      function closeZoomOverlay() {
        overlay.classList.remove("open");
        document.body.style.overflow = "";
      }

      overlayClose.addEventListener("click", closeZoomOverlay);
      overlay.addEventListener("click", function(e) {
        if (e.target === overlay) closeZoomOverlay();
      });
      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape" && overlay.classList.contains("open")) closeZoomOverlay();
      });
    })();

    function setActiveImage(index, images) {
      activeImageIndex = index;
      document.getElementById("galleryMainImg").src = images[index];
      document.querySelectorAll(".gallery-thumb").forEach(function(t, i) {
        t.classList.toggle("active", i === index);
      });
    }
  </script>
</body>
</html>
